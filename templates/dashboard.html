<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unblock Monitor Dashboard</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #f0f0f0;
      font-family: sans-serif;
      padding: 2rem;
    }
    h1 {
      color: #00ffcc;
    }
    .entry {
      border: 1px solid #444;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      background: #1a1a1a;
    }
    .entry img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 10px;
    }
    .status {
      color: #00cc66;
      font-weight: bold;
    }
    .timestamp {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>📊 Unblock Tracker Dashboard</h1>
  {% for entry in entries %}
    <div class="entry">
      <div class="timestamp">🕒 {{ entry.timestamp }}</div>
      <div class="status">✅ {{ entry.status }}</div>
      {% if entry.img_url %}
        <img src="{{ entry.img_url }}" alt="Unblock Screenshot"/>
      {% endif %}
    </div>
  {% else %}
    <p>No unblock events yet.</p>
  {% endfor %}
</body>
</html>
